id: crr_ccr_imm
title: CRR counterparty credit risk internal model method (IMM, Art. 283-294)
version_note: >-
  Based on Regulation (EU) No 575/2013 (CRR) as amended, Part Three, Title II, Chapter 6, Section 6 (Internal Model
  Method, Art. 283-294). Paraphrased; article points cited only where certain. CVA risk (Title VI) is not covered.
  Review against the current consolidated text before relying on it.
applies_to: [ccr]
requirements:
  - id: IMM-283-01
    topic: Scope and permission
    requirement: "The transactions and netting sets in scope of the IMM are identified, and transactions outside the scope are treated under another permitted method."
    source: "CRR Art. 283"
    keywords: [IMM, scope, netting set, permission, roll-out, SA-CCR, transactions in scope]
    evidence_expected: "IMM scope and treatment of out-of-scope trades."
  - id: IMM-284-01
    topic: Effective EPE and alpha
    requirement: "Exposure value is computed as alpha times effective EPE, with alpha equal to 1.4 unless the competent authority permits an own estimate (subject to the CRR floor)."
    source: "CRR Art. 284"
    keywords: [alpha, "1.4", effective EPE, EEPE, exposure value, own estimate of alpha]
    patterns: ['\balpha\b.*\b1[.,][24]\b']
    evidence_expected: "Alpha used and, if own estimate, its methodology."
  - id: IMM-284-02
    topic: Expected exposure profile
    requirement: "The model produces the distribution of exposure values over future dates and computes EE, EPE, effective EE and effective EPE over the first year as defined in the CRR."
    source: "CRR Art. 284; Art. 272 (definitions)"
    keywords: [expected exposure, EE, EPE, effective EE, effective EPE, exposure profile, time buckets]
    evidence_expected: "Exposure metrics definitions and time grid."
  - id: IMM-284-03
    topic: Stressed calibration
    requirement: "Effective EPE is calculated with parameters calibrated on current market data and on stressed data, and the higher result is used, with the stress period selection documented."
    source: "CRR Art. 284"
    keywords: [stressed calibration, stress period, current market data, three years, effective EPE, stressed EEPE]
    evidence_expected: "Current vs stressed calibration and period selection."
  - id: IMM-285-01
    topic: Margin period of risk
    requirement: "For margined netting sets, the margin period of risk respects the CRR floors (by transaction type), is increased for large netting sets or illiquid collateral/hard-to-replace derivatives, and doubled where margin disputes exceeded the CRR limit."
    source: "CRR Art. 285"
    keywords: [margin period of risk, MPOR, five business days, ten business days, 20 business days, margin disputes, illiquid collateral]
    patterns: ['\b(5|10|20)\s+business\s+days?\b']
    evidence_expected: "MPOR by netting set and evidence of floor/increase checks."
  - id: IMM-285-02
    topic: Margin agreement modelling
    requirement: "Margin agreements are modelled including thresholds, minimum transfer amounts, independent amounts and the remargining frequency; where they are not modelled, the CRR shortcut method is applied."
    source: "CRR Art. 285"
    keywords: [margin agreement, threshold, minimum transfer amount, remargining, shortcut method, CSA, collateral]
    evidence_expected: "Collateral/margin modelling or shortcut."
  - id: IMM-286-01
    topic: CCR management framework
    requirement: "Policies, processes and systems for CCR management (identification, measurement, management, approval and reporting) are documented and the CCR control unit is independent."
    source: "CRR Art. 286-287"
    keywords: [CCR management, policies, processes, control unit, independent, reporting, limits]
    evidence_expected: "CCR governance and control unit description."
  - id: IMM-288-01
    topic: Review of CCR management system
    requirement: "The CCR management system, including the exposure model, is subject to regular independent review by internal audit."
    source: "CRR Art. 288"
    keywords: [internal audit, independent review, regular review, audit, CCR management system]
    evidence_expected: "Most recent audit review of the IMM framework."
  - id: IMM-289-01
    topic: Use test
    requirement: "The exposure distribution generated by the model is closely integrated into the day-to-day CCR management (limits, economic capital), with the model used for at least one year before permission."
    source: "CRR Art. 289"
    keywords: [use test, limits, credit limits, day-to-day, economic capital, PFE, potential future exposure]
    evidence_expected: "Use of model outputs in limits and risk management."
  - id: IMM-290-01
    topic: Stress testing
    requirement: "A comprehensive stress testing programme for CCR identifies concentrations and wrong-way exposures, covers all counterparties' trades, and results are reviewed by senior management."
    source: "CRR Art. 290"
    keywords: [stress testing, stress scenarios, concentrations, reverse stress test, senior management, counterparty]
    evidence_expected: "CCR stress test scope, frequency and results."
  - id: IMM-291-01
    topic: Wrong-way risk
    requirement: "Specific wrong-way risk is identified, monitored and controlled (with exposure measured accordingly), and general wrong-way risk is identified via stress tests and scenario analysis."
    source: "CRR Art. 291"
    keywords: [wrong-way risk, specific wrong-way risk, general wrong-way risk, legal connection, correlation, WWR]
    evidence_expected: "WWR identification process and treatment."
  - id: IMM-292-01
    topic: Integrity of the modelling process
    requirement: "The model reflects transaction terms and specifications (including netting and collateral agreements) in a timely, complete and conservative way, with data feeds reconciled to source systems."
    source: "CRR Art. 292"
    keywords: [transaction terms, netting agreement, data integrity, reconciliation, source systems, timely, complete]
    evidence_expected: "Data reconciliation and trade-capture controls."
  - id: IMM-292-02
    topic: Calibration data history
    requirement: "Model parameters are estimated on historical data of at least three years, updated at least quarterly (or more often if market conditions warrant), and the calibration approach is documented."
    source: "CRR Art. 292"
    keywords: [three years, 3 years, historical data, quarterly, calibration, parameter estimation, update frequency]
    patterns: ['\b(3|three)\s+years?\b', 'quarterly']
    evidence_expected: "Calibration history length and update frequency."
  - id: IMM-293-01
    topic: Risk management system requirements
    requirement: "The CCR control unit is responsible for the design and implementation of the CCR management system, including initial and ongoing validation of the model, and performs regular back-testing of the exposure model."
    source: "CRR Art. 293"
    keywords: [CCR control unit, design, implementation, back-testing, initial validation, ongoing validation]
    evidence_expected: "Responsibilities for model design, validation and back-testing."
  - id: IMM-294-01
    topic: Validation and back-testing
    requirement: "The exposure model is validated, including back-testing of risk factor forecasts and of representative (including hypothetical) portfolios over multiple forecasting horizons of at least one year, and pricing models used in the exposure engine are validated against independent benchmarks."
    source: "CRR Art. 294"
    keywords: [back-testing, risk factor, representative portfolios, hypothetical portfolios, forecasting horizons, one year, pricing models, benchmark]
    evidence_expected: "Back-testing framework, results by horizon, and pricing model validation."
  - id: IMM-294-02
    topic: Validation of non-normality and dependence
    requirement: "Validation tests whether the model captures the relevant characteristics of the exposure distribution, including non-normality, dependence between risk factors and collateral, and the effect of margining."
    source: "CRR Art. 294"
    keywords: [non-normal, fat tails, dependence, correlation, distribution, margining, collateral]
    evidence_expected: "Distributional and dependence tests in validation."
