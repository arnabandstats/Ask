[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    slow: runs the real deterministic test engine (sklearn/shap); deselect with -m "not slow"
    live: calls the real LLM API; skipped unless ASK_LIVE_TESTS=1
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
